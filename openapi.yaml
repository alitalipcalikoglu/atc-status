openapi: 3.1.0
info:
  title: atc-status
  version: "1.0.0"
  description: >
    Uptime monitors with HTTP checks. Each monitor is checked every `intervalSec`; a check passes
    when the response status is in `expectStatus` within `timeoutMs` (redirects are not followed).
    `failThreshold` failed checks in a row open an incident (one per monitor at most); the first
    passing check closes it. Opening and closing an incident e-mails ALERT_EMAILS through atc-notify
    when configured. Monitors created through the API pass the SSRF guard (`TARGET_*`); monitors
    seeded from `MONITOR_SEEDS` (`<id>-health`, `<id>-ready`) are operator configuration.


    Auth: `Authorization: Bearer <api-key>` on every `/v1/*` and `/metrics` route. Roles: `read`
    (monitors, checks, incidents, stats) and `admin` (also create, change, check now, delete).
    `/status` and `/status/summary.json` are public and show public monitors only, without URLs or
    error texts.
servers:
  - url: /
security:
  - ApiKeyAuth: []
tags:
  - name: monitors
  - name: incidents
  - name: alerts
  - name: maintenance
  - name: subscribers
  - name: public
  - name: stats
  - name: ops
paths:
  /openapi.yaml:
    get:
      operationId: atc-status.openapi
      summary: Download the canonical OpenAPI document
      security: []
      responses:
        "200": { description: Canonical OpenAPI document., content: { text/yaml: { schema: { type: string } } } }
  /health:
    get:
      operationId: atc-status.health.get
      summary: Liveness probe
      tags: [ops]
      security: []
      x-stack-visibility: public
      responses:
        "200": { description: Process is up., content: { application/json: { schema: { type: object, required: [status], properties: { status: { type: string, enum: [ok] } } } } } }
  /ready:
    get:
      operationId: atc-status.ready.get
      summary: Readiness probe
      description: Database ping, cached for 10 seconds. The body also says how many monitors exist, whether the checker runs and whether alerts are enabled.
      tags: [ops]
      security: []
      x-stack-visibility: public
      responses:
        "200":
          description: Ready.
          content:
            application/json:
              schema:
                type: object
                required: [status, monitors, checker, notify, alertHook]
                properties:
                  status: { type: string, enum: [ok] }
                  monitors: { type: integer }
                  checker: { type: string, enum: [running, stopped] }
                  notify: { type: string, enum: [enabled, disabled] }
                  alertHook: { type: string, enum: [enabled, disabled] }
        "503": { description: The cached readiness check last failed., content: { application/json: { schema: { type: object, required: [status, error], properties: { status: { type: string, enum: [unavailable] }, error: { type: string } } } } } }
  /v1/info:
    get:
      operationId: atc-status.info.get
      summary: Service identity and capabilities
      tags: [ops]
      security: []
      x-stack-visibility: public
      responses:
        "200":
          description: Instance identity.
          content:
            application/json:
              schema:
                type: object
                required: [service, version, apiVersion, capabilities, schemaVersion, serviceCore]
                properties:
                  service: { type: string, const: atc-status }
                  version: { type: string }
                  apiVersion: { type: string, const: v1 }
                  capabilities: { type: array, items: { type: string }, description: "`http-checks`, `incidents`, `email-alerts`, `public-status-page`, `seeded-monitors`, `ssrf-guard`." }
                  schemaVersion: { type: integer }
                  serviceCore: { type: string }
  /metrics:
    get:
      operationId: atc-status.metrics.get
      summary: Prometheus text-format metrics
      description: Requires a `read`-capable key. Not rate-limited.
      tags: [ops]
      x-stack-visibility: operational
      responses:
        "200": { description: "`status_monitor_up{monitor}`, `status_check_latency_ms{monitor}`, `status_incident_open{monitor}`, `status_process_uptime_seconds`.", content: { text/plain: { schema: { type: string } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /status:
    get:
      operationId: atc-status.page.get
      summary: Public status page (HTML)
      description: Overall state, public monitors with 24 h and 7 d uptime, recent incidents. No scripts; strict CSP; cached for STATUS_PAGE_CACHE_SEC.
      tags: [public]
      security: []
      x-stack-visibility: public
      responses:
        "200": { description: The page., content: { text/html: { schema: { type: string } } } }
  /status/summary.json:
    get:
      operationId: atc-status.page.summary
      summary: Public status data (JSON)
      description: The data behind the status page. CORS open; cached for STATUS_PAGE_CACHE_SEC.
      tags: [public]
      security: []
      x-stack-visibility: public
      responses:
        "200":
          description: Public summary.
          content:
            application/json:
              schema:
                type: object
                required: [title, overall, updatedAt, monitors, incidents]
                properties:
                  title: { type: string }
                  overall: { type: string, enum: [operational, degraded, outage, maintenance] }
                  subscribe: { type: boolean, description: Whether the page offers e-mail subscriptions. }
                  maintenance:
                    type: array
                    description: Active windows and those starting within 14 days that touch a public monitor.
                    items:
                      type: object
                      properties:
                        title: { type: string }
                        message: { type: string }
                        startsAt: { type: string, format: date-time }
                        endsAt: { type: string, format: date-time }
                        active: { type: boolean }
                        monitors: { type: [array, "null"], items: { type: string }, description: Monitor names; null = everything. }
                  updatedAt: { type: string, format: date-time }
                  monitors:
                    type: array
                    items:
                      type: object
                      properties:
                        name: { type: string }
                        state: { $ref: "#/components/schemas/State" }
                        uptime24h: { type: [number, "null"] }
                        uptime7d: { type: [number, "null"] }
                        latencyMs: { type: [integer, "null"] }
                        checkedAt: { type: [string, "null"], format: date-time }
                  incidents:
                    type: array
                    items:
                      type: object
                      properties:
                        monitor: { type: string, description: Monitor name. }
                        openedAt: { type: string, format: date-time }
                        closedAt: { type: [string, "null"], format: date-time }
                        durationSec: { type: integer }
                        updates: { type: array, items: { type: object, properties: { status: { type: string }, message: { type: string }, at: { type: string, format: date-time } } } }

  /v1/monitors:
    get:
      operationId: atc-status.monitors.list
      summary: Monitors with their state
      tags: [monitors]
      responses:
        "200":
          description: Every monitor, by id.
          content:
            application/json:
              schema: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: "#/components/schemas/Monitor" } }, nextCursor: { type: "null", description: Always null; the list is complete. } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/monitors/{id}:
    parameters: [{ $ref: "#/components/parameters/MonitorParam" }]
    put:
      operationId: atc-status.monitors.upsert
      summary: Create a monitor or change it (admin)
      description: Omitted fields keep their value (defaults on create - GET, every 60 s, 5 s timeout, expect 200, 2 failures, not public). `url` is required on create; the URL of a seeded monitor cannot be changed. A new monitor, a new URL or interval, or unpausing checks at once.
      tags: [monitors]
      requestBody:
        content:
          application/json:
            schema: { $ref: "#/components/schemas/MonitorSettings" }
      responses:
        "200": { $ref: "#/components/responses/MonitorSet" }
        "201": { $ref: "#/components/responses/MonitorSet" }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "409": { $ref: "#/components/responses/Conflict" }
    get:
      operationId: atc-status.monitors.get
      summary: One monitor with uptime over 24 h, 7 d and 30 d
      tags: [monitors]
      responses:
        "200":
          description: The monitor.
          content:
            application/json:
              schema:
                type: object
                required: [monitor, uptime, openIncident]
                properties:
                  monitor: { $ref: "#/components/schemas/Monitor" }
                  uptime:
                    type: object
                    additionalProperties: { type: object, properties: { checks: { type: integer }, uptime: { type: [number, "null"] }, avgMs: { type: [integer, "null"] } } }
                  openIncident: { oneOf: [{ $ref: "#/components/schemas/Incident" }, { type: "null" }] }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
    delete:
      operationId: atc-status.monitors.delete
      summary: Delete a monitor with its checks and incidents (admin)
      description: Seeded monitors cannot be deleted (`409 INVALID_STATE`); pause them instead.
      tags: [monitors]
      responses:
        "204": { description: Deleted. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }
        "409": { $ref: "#/components/responses/Conflict" }

  /v1/monitors/{id}/check:
    parameters: [{ $ref: "#/components/parameters/MonitorParam" }]
    post:
      operationId: atc-status.monitors.check
      summary: Check a monitor now (admin)
      description: Runs one check (paused or not), records it and applies the incident rules like a scheduled check.
      tags: [monitors]
      responses:
        "200":
          description: Result and the monitor afterwards.
          content:
            application/json:
              schema:
                type: object
                required: [check, monitor]
                properties:
                  check: { type: object, properties: { ok: { type: boolean }, status: { type: [integer, "null"] }, latencyMs: { type: integer }, error: { type: [string, "null"] } } }
                  monitor: { $ref: "#/components/schemas/Monitor" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/monitors/{id}/checks:
    parameters: [{ $ref: "#/components/parameters/MonitorParam" }]
    get:
      operationId: atc-status.monitors.checks
      summary: Recent checks, newest first
      tags: [monitors]
      parameters:
        - { name: limit, in: query, schema: { type: string, pattern: "^([1-9]|[1-9][0-9]|1[0-9][0-9]|200)$" }, description: "1-200, default 50." }
        - { name: cursor, in: query, schema: { type: string, pattern: "^[0-9]{1,15}$" } }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: "#/components/schemas/Check" } }, nextCursor: { type: [string, "null"] } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/incidents:
    get:
      operationId: atc-status.incidents.list
      summary: Incidents, newest first
      tags: [incidents]
      parameters:
        - { name: monitor, in: query, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" } }
        - { name: state, in: query, schema: { type: string, enum: [open, closed] } }
        - { name: limit, in: query, schema: { type: string, pattern: "^([1-9]|[1-9][0-9]|100)$" } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: "#/components/schemas/Incident" } }, nextCursor: { type: [string, "null"] } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/incidents/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: "^inc_[0-9a-z]{6,12}[0-9a-f]{16}$" } }]
    get:
      operationId: atc-status.incidents.get
      summary: One incident
      tags: [incidents]
      responses:
        "200": { description: The incident and its written updates., content: { application/json: { schema: { type: object, required: [incident, updates], properties: { incident: { $ref: "#/components/schemas/Incident" }, updates: { type: array, items: { $ref: "#/components/schemas/IncidentUpdate" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/incidents/{id}/updates:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: "^inc_[0-9a-z]{6,12}[0-9a-f]{16}$" } }]
    post:
      operationId: atc-status.incidents.addUpdate
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      summary: Post a written update on an incident (admin)
      description: Shown on the public page under the incident. `resolved` on an open incident closes it (and sends the closing alert).
      tags: [incidents]
      requestBody: { required: true, content: { application/json: { schema: { type: object, additionalProperties: false, required: [status, message], properties: { status: { type: string, enum: [investigating, identified, monitoring, resolved] }, message: { type: string, minLength: 1, maxLength: 2000 } } } } } }
      responses:
        "201": { description: Posted., content: { application/json: { schema: { type: object, properties: { incident: { $ref: "#/components/schemas/Incident" }, updates: { type: array, items: { $ref: "#/components/schemas/IncidentUpdate" } } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/maintenance:
    get:
      operationId: atc-status.maintenance.list
      summary: Maintenance windows (active and planned; past 30 days)
      tags: [maintenance]
      responses:
        "200": { description: Windows., content: { application/json: { schema: { type: object, required: [current, past], properties: { current: { type: array, items: { $ref: "#/components/schemas/Maintenance" } }, past: { type: array, items: { $ref: "#/components/schemas/Maintenance" } } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
    post:
      operationId: atc-status.maintenance.create
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      summary: Plan a maintenance window (admin)
      description: While active, failures of the listed monitors (all when `monitors` is empty or null) open no incident and send no alert; the public page shows the window and those monitors as in maintenance. At most 30 days long.
      tags: [maintenance]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [title, startsAt, endsAt]
              properties:
                title: { type: string, minLength: 1, maxLength: 120 }
                message: { type: string, maxLength: 1000 }
                monitors: { type: [array, "null"], maxItems: 100, items: { type: string } }
                startsAt: { type: string, format: date-time }
                endsAt: { type: string, format: date-time }
      responses:
        "201": { description: Planned., content: { application/json: { schema: { type: object, properties: { maintenance: { $ref: "#/components/schemas/Maintenance" } } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/maintenance/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: "^mnt_[0-9a-z]{6,12}[0-9a-f]{16}$" } }]
    delete:
      operationId: atc-status.maintenance.delete
      summary: End or cancel a window (admin)
      tags: [maintenance]
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/subscribers:
    get:
      operationId: atc-status.subscribers.list
      summary: Status page subscribers (admin; contains addresses)
      tags: [subscribers]
      parameters:
        - { name: limit, in: query, required: false, description: "1-500, default 100.", schema: { type: string, pattern: "^([1-9]|[1-9][0-9]|[1-4][0-9][0-9]|500)$" } }
        - { name: cursor, in: query, required: false, description: Opaque `nextCursor` from the previous page., schema: { type: string, pattern: "^sub_[0-9a-z]{6,12}[0-9a-f]{16}$" } }
      responses:
        "200":
          description: A page of subscribers, newest first, and the totals.
          content:
            application/json:
              schema:
                type: object
                required: [items, nextCursor, counts, enabled]
                properties:
                  nextCursor: { type: [string, "null"], description: Pass as `cursor` for older subscribers; null on the last page. }
                  enabled: { type: boolean }
                  counts: { type: object, properties: { total: { type: integer }, confirmed: { type: integer } } }
                  items: { type: array, items: { type: object, properties: { id: { type: string }, email: { type: string }, confirmed: { type: boolean }, confirmedAt: { type: [string, "null"], format: date-time }, createdAt: { type: string, format: date-time } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/subscribers/{id}:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: "^sub_[0-9a-z]{6,12}[0-9a-f]{16}$" } }]
    delete:
      operationId: atc-status.subscribers.delete
      summary: Remove a subscriber (admin)
      tags: [subscribers]
      responses:
        "204": { description: Removed. }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /status/subscribe:
    post:
      operationId: atc-status.page.subscribe
      summary: Subscribe to the status page by e-mail (HTML form post)
      description: Needs STATUS_PUBLIC_URL and atc-notify. Always the same answer for a valid address (no hint whether it was already subscribed); a confirmation mail goes out. Rate limited per address (10 per minute).
      tags: [public]
      security: []
      x-stack-visibility: public
      requestBody: { required: true, content: { application/x-www-form-urlencoded: { schema: { type: object, required: [email], properties: { email: { type: string } } } } } }
      responses:
        "200": { description: HTML page., content: { text/html: { schema: { type: string } } } }
        "400": { description: HTML page; not an e-mail address., content: { text/html: { schema: { type: string } } } }
        "404": { description: HTML page; subscriptions are off., content: { text/html: { schema: { type: string } } } }
        "429": { description: Rate limited. }

  /status/subscribe/{token}:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    get:
      operationId: atc-status.page.subscribeConfirmPage
      summary: The confirmation link (shows a button; changes nothing)
      tags: [public]
      security: []
      x-stack-visibility: public
      responses:
        "200": { description: HTML page with a form., content: { text/html: { schema: { type: string } } } }
        "404": { description: HTML page; not a valid link., content: { text/html: { schema: { type: string } } } }
    post:
      operationId: atc-status.page.subscribeConfirm
      summary: Confirm the subscription
      tags: [public]
      security: []
      x-stack-visibility: public
      responses:
        "200": { description: HTML page., content: { text/html: { schema: { type: string } } } }
        "404": { description: HTML page; not a valid link., content: { text/html: { schema: { type: string } } } }

  /status/unsubscribe/{token}:
    parameters: [{ name: token, in: path, required: true, schema: { type: string } }]
    get:
      operationId: atc-status.page.unsubscribePage
      summary: The unsubscribe link in every mail (shows a button)
      tags: [public]
      security: []
      x-stack-visibility: public
      responses:
        "200": { description: HTML page with a form., content: { text/html: { schema: { type: string } } } }
        "404": { description: HTML page; not a valid link., content: { text/html: { schema: { type: string } } } }
    post:
      operationId: atc-status.page.unsubscribe
      summary: Leave the list
      tags: [public]
      security: []
      x-stack-visibility: public
      responses:
        "200": { description: HTML page., content: { text/html: { schema: { type: string } } } }
        "404": { description: HTML page; not a valid link., content: { text/html: { schema: { type: string } } } }

  /v1/hooks/webhook-out:
    post:
      operationId: atc-status.hooks.webhook-out
      summary: Receive a signed webhook-out delivery; ops.* events become alerts (no API key, HMAC signature)
      tags: [alerts]
      security: []
      parameters:
        - { name: x-webhook-signature, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, required: [type], properties: { id: { type: string }, type: { type: string }, createdAt: { type: string }, data: { type: object } } }
      responses:
        "202":
          description: Accepted.
          content: { application/json: { schema: { type: object, required: [outcome, id], properties: { outcome: { type: string, enum: [alerted, repeated, ignored] }, id: { type: [string, "null"] } } } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { description: The signature does not match or the timestamp is stale. }
        "404": { description: The hook is disabled (no ALERT_HOOK_SECRET). }

  /v1/alerts:
    get:
      operationId: atc-status.alerts.list
      summary: Operational alerts, newest first
      tags: [alerts]
      parameters:
        - { name: state, in: query, schema: { type: string, enum: [open, acked] } }
        - { name: limit, in: query, schema: { type: string, pattern: "^([1-9]|[1-9][0-9]|100)$" } }
        - { name: cursor, in: query, schema: { type: string } }
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema: { type: object, required: [items, nextCursor], properties: { items: { type: array, items: { $ref: "#/components/schemas/Alert" } }, nextCursor: { type: [string, "null"] } } }
        "400": { $ref: "#/components/responses/BadRequest" }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

  /v1/alerts/{id}/ack:
    parameters: [{ name: id, in: path, required: true, schema: { type: string, pattern: "^alr_[0-9a-z]{6,12}[0-9a-f]{16}$" } }]
    post:
      operationId: atc-status.alerts.ack
      parameters:
        - $ref: '#/components/parameters/IdempotencyKeyHeader'
      summary: Acknowledge an alert (admin)
      tags: [alerts]
      responses:
        "200": { description: The acknowledged alert., content: { application/json: { schema: { type: object, required: [alert], properties: { alert: { $ref: "#/components/schemas/Alert" } } } } } }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }
        "404": { $ref: "#/components/responses/NotFound" }

  /v1/ping/{id}/{token}:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" } }
      - { name: token, in: path, required: true, schema: { type: string, pattern: "^[0-9a-f]{40}$" } }
    post:
      operationId: atc-status.ping.post
      summary: A heartbeat from a monitored job (no API key; the path token is the credential)
      description: Records the ping. A monitor with an open incident is checked at once and recovers on the ping. GET does the same, for curl and wget.
      tags: [monitors]
      security: []
      responses:
        "204": { description: Recorded. }
        "404": { description: No heartbeat monitor with that id and token (or it is paused). }
    get:
      operationId: atc-status.ping.get
      summary: Same as POST
      tags: [monitors]
      security: []
      responses:
        "204": { description: Recorded. }
        "404": { description: No heartbeat monitor with that id and token (or it is paused). }

  /v1/stats:
    get:
      operationId: atc-status.stats.get
      summary: Monitors by state and incident counts
      tags: [stats]
      responses:
        "200":
          description: Totals.
          content:
            application/json:
              schema:
                type: object
                required: [monitors, up, down, degraded, unknown, paused, openIncidents, incidents24h, openAlerts, criticalAlerts, notify]
                properties:
                  monitors: { type: integer }
                  up: { type: integer }
                  down: { type: integer }
                  degraded: { type: integer }
                  unknown: { type: integer }
                  paused: { type: integer }
                  openIncidents: { type: integer }
                  incidents24h: { type: integer }
                  openAlerts: { type: integer }
                  criticalAlerts: { type: integer }
                  notify: { type: boolean }
        "401": { $ref: "#/components/responses/Unauthorized" }
        "403": { $ref: "#/components/responses/Forbidden" }

components:
  securitySchemes:
    ApiKeyAuth:
      type: http
      scheme: bearer
      description: "`STATUS_API_KEYS=id:secret:role`; role `read` or `admin`."
  parameters:
    IdempotencyKeyHeader:
      name: Idempotency-Key
      in: header
      required: false
      description: "Optional. Repeats of this POST with the same key (per API key, 24 h) replay the first 2xx answer with `Idempotent-Replayed: true` instead of running again; the same key with another method, path or body is `409 IDEMPOTENCY_MISMATCH`, while the first still runs `409 IDEMPOTENCY_IN_PROGRESS`."
      schema: { type: string, pattern: '^[A-Za-z0-9._:-]{8,255}$' }
    MonitorParam: { name: id, in: path, required: true, schema: { type: string, pattern: "^[a-z0-9][a-z0-9-]{0,63}$" } }
  responses:
    BadRequest: { description: "`VALIDATION_FAILED`, `INVALID_ARGUMENT` or `TARGET_NOT_ALLOWED`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Unauthorized: { description: Missing or invalid API key., headers: { www-authenticate: { schema: { type: string, const: Bearer } } }, content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Forbidden: { description: "`FORBIDDEN`: role.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    NotFound: { description: "`MONITOR_NOT_FOUND` or `INCIDENT_NOT_FOUND`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    Conflict: { description: "`INVALID_STATE` or `LIMIT_EXCEEDED`.", content: { application/json: { schema: { $ref: "#/components/schemas/ErrorEnvelope" } } } }
    MonitorSet: { description: Created (201) or updated (200)., content: { application/json: { schema: { type: object, required: [created, monitor], properties: { created: { type: boolean }, monitor: { $ref: "#/components/schemas/Monitor" }, pingToken: { type: string, description: "Heartbeat monitors on create or rotateToken, once." }, pingPath: { type: string, description: "`/v1/ping/{id}/{token}` for the same cases." } } } } } }
  schemas:
    ErrorEnvelope: { type: object, required: [error], properties: { error: { type: object, required: [code, message], properties: { code: { type: string }, message: { type: string }, details: {} } } } }
    State: { type: string, enum: [up, down, degraded, unknown, paused, maintenance], description: "`down` = open incident; `degraded` = last check failed, below the threshold; `maintenance` = inside an active maintenance window." }
    MonitorSettings:
      type: object
      additionalProperties: false
      properties:
        name: { type: string, minLength: 1, maxLength: 100 }
        description: { type: string, maxLength: 500 }
        kind: { type: string, enum: [http, tcp, tls, dns, heartbeat], description: "Fixed at creation; default `http`. `tcp` and `tls` take an https URL with host and port as `url` (only host and port are used). `dns` takes a host name as `url` and looks up `dnsType` records. `heartbeat` has no target: the monitored job pings `/v1/ping/{id}/{token}` within `intervalSec` plus `graceSec`." }
        dnsType: { type: string, enum: [A, AAAA, CNAME, MX, TXT, NS], description: "dns only, default A." }
        url: { type: string, minLength: 1, maxLength: 2000, description: "http/tcp/tls: an http(s) URL; dns: a host name such as example.com." }
        method: { type: string, enum: [GET, HEAD] }
        expectText: { type: [string, "null"], maxLength: 200, description: "http with GET: text the first KiB of the body must contain; dns: text one of the records must contain (e.g. the expected address)." }
        warnDays: { type: integer, minimum: 1, maximum: 365, description: "tls only, default 14: fail when the certificate expires within this many days." }
        graceSec: { type: integer, minimum: 0, maximum: 86400, description: "heartbeat only, default 60: how late a ping may be." }
        rotateToken: { type: boolean, description: "heartbeat only: issue a new ping token (shown once in the response); the old one stops working." }
        intervalSec: { type: integer, minimum: 10, maximum: 86400 }
        timeoutMs: { type: integer, minimum: 500, maximum: 60000, description: Not more than the interval. }
        expectStatus: { type: array, minItems: 1, maxItems: 20, items: { type: integer, minimum: 100, maximum: 599 } }
        failThreshold: { type: integer, minimum: 1, maximum: 20, description: Failed checks in a row that open an incident. }
        public: { type: boolean, description: Shown on the public status page (by name only). }
        paused: { type: boolean }
    Monitor:
      type: object
      properties:
        id: { type: string }
        kind: { type: string, enum: [http, tcp, tls, dns, heartbeat] }
        dnsType: { type: [string, "null"], enum: [A, AAAA, CNAME, MX, TXT, NS, null] }
        name: { type: string }
        description: { type: string }
        url: { type: [string, "null"], description: "null for heartbeat monitors." }
        method: { type: [string, "null"], enum: [GET, HEAD, null], description: "null unless kind is http." }
        expectText: { type: [string, "null"] }
        warnDays: { type: [integer, "null"] }
        graceSec: { type: [integer, "null"] }
        lastPingAt: { type: [string, "null"], format: date-time }
        intervalSec: { type: integer }
        timeoutMs: { type: integer }
        expectStatus: { type: array, items: { type: integer } }
        failThreshold: { type: integer }
        public: { type: boolean }
        paused: { type: boolean }
        origin: { type: string, enum: [env, api], description: "`env` = from MONITOR_SEEDS." }
        state: { $ref: "#/components/schemas/State" }
        consecutiveFailures: { type: integer }
        lastCheck: { oneOf: [{ $ref: "#/components/schemas/Check" }, { type: "null" }] }
        nextCheckAt: { type: [string, "null"], format: date-time }
        uptime24h: { type: [number, "null"] }
        avgLatency24hMs: { type: [integer, "null"] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    Check:
      type: object
      properties:
        at: { type: string, format: date-time }
        ok: { type: boolean }
        status: { type: [integer, "null"] }
        latencyMs: { type: integer }
        error: { type: [string, "null"] }
    Alert:
      type: object
      properties:
        id: { type: string }
        type: { type: string }
        key: { type: string }
        severity: { type: string, enum: [info, warning, critical] }
        title: { type: string }
        message: { type: string }
        data: { type: object }
        source: { type: [string, "null"] }
        count: { type: integer }
        firstAt: { type: string, format: date-time }
        lastAt: { type: string, format: date-time }
        state: { type: string, enum: [open, acked] }
        ackedAt: { type: [string, "null"], format: date-time }
        ackedBy: { type: [string, "null"] }
        notifyError: { type: [string, "null"] }
    Maintenance:
      type: object
      properties:
        id: { type: string }
        title: { type: string }
        message: { type: string }
        monitors: { type: [array, "null"], items: { type: string } }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        state: { type: string, enum: [planned, active, ended] }
        createdBy: { type: string }
        createdAt: { type: string, format: date-time }
    IncidentUpdate:
      type: object
      properties:
        at: { type: string, format: date-time }
        status: { type: string, enum: [investigating, identified, monitoring, resolved] }
        message: { type: string }
        by: { type: string }
    Incident:
      type: object
      properties:
        id: { type: string }
        monitor: { type: string }
        state: { type: string, enum: [open, closed] }
        openedAt: { type: string, format: date-time }
        closedAt: { type: [string, "null"], format: date-time }
        durationSec: { type: integer }
        cause: { type: string }
        lastError: { type: [string, "null"] }
        failures: { type: integer }
        notifyError: { type: [string, "null"] }
